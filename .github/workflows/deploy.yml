name: Publish Jex Bot

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish mobile app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out app
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Verify app and model
        run: |
          for file in web/*.mjs web/sw.js; do
            node --check "$file"
          done
          python3 - <<'PY'
          from hashlib import sha256
          import json
          from pathlib import Path

          root = Path("web")
          spec = json.loads((root / "model/model.json").read_text())
          weights = b"".join((root / "model" / name).read_bytes() for name in spec["weights"])
          assert len(weights) == spec["bytes"], "Model size mismatch"
          assert sha256(weights).hexdigest() == spec["sha256"], "Model checksum mismatch"
          manifest = json.loads((root / "manifest.webmanifest").read_text())
          for icon in manifest["icons"]:
              assert (root / icon["src"]).is_file(), "Missing app icon"
          assert (root / "index.html").is_file(), "Missing app entry point"
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload app
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web

      - name: Deploy app
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Show phone link
        env:
          APP_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          {
            echo "## Jex Bot is ready"
            echo
            echo "[Open Jex Bot on your phone]($APP_URL)"
            echo
            echo "On iPhone, open the link in Safari, tap Share, then Add to Home Screen."
            echo
            echo "On Android, open the link in Chrome, then choose Install app or Add to Home screen."
          } >> "$GITHUB_STEP_SUMMARY"
