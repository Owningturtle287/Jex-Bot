name: Train Jex on GPU

on:
  workflow_dispatch:
    inputs:
      pretrain_steps:
        description: "Pretraining optimizer steps"
        required: true
        default: "24414"
        type: string
      chat_steps:
        description: "Conversation tuning optimizer steps"
        required: true
        default: "4000"
        type: string

permissions:
  contents: read

concurrency:
  group: jex-gpu-training
  cancel-in-progress: false

jobs:
  train:
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, gpu]
    timeout-minutes: 360
    steps:
      - name: Check out training code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check CUDA GPU
        run: |
          nvidia-smi
          python3 -c "import sys; assert sys.version_info >= (3, 11), 'Python 3.11 or newer is required'"
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install -r requirements.txt
          .venv/bin/python -c "import torch; assert torch.cuda.is_available(), 'CUDA-enabled PyTorch and an attached GPU are required'; print(torch.cuda.get_device_name(0))"

      - name: Train and evaluate
        env:
          PRETRAIN_STEPS: ${{ inputs.pretrain_steps }}
          CHAT_STEPS: ${{ inputs.chat_steps }}
        run: |
          source .venv/bin/activate
          bash scripts/train-gpu.sh "$PRETRAIN_STEPS" "$CHAT_STEPS"

      - name: Save checkpoints and evaluation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: jex-gpu-training-${{ github.run_id }}
          path: |
            runs/
            corpus/base-pretrain/tokenizer.json
            corpus/base-pretrain/stats.json
            corpus/base-chat/stats.json
          retention-days: 7
          if-no-files-found: ignore
